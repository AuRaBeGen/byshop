<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>By Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<nav class="navbar">
    <div class="logo">By Shop</div>

    <div class="menu">
        <a href="#">หน้าแรก</a>

        <a href="#">โปรโมชั่น</a>
        <a href="#">ติดต่อ</a>

</nav>
<header>
    By Shop
</header>

<div class="banner">
    <h2>Fashion Collection 2026</h2>
    <p>เสื้อผ้าแฟชั่น ราคาพิเศษ</p>
</div>

<div class="products">

    <div class="product">
        <img src="images/471425023_622026890359448_9179641437741520320_n.jpg" alt="Oversize T-Shirt">
        <h3>Oversize T-Shirt</h3>
        <p>250 บาท</p>
        <button onclick="buyItem('Oversize T-Shirt')">สั่งซื้อ</button>
        <button onclick="buy('Oversize T-Shirt')">
            ซื้อเลย
        </button>
    </div>

    <div class="product">
        <img src="images/471512700_618777970684340_8265207670509938331_n.jpg" alt="Jeans">
        <h3>Jeans</h3>
        <p>390 บาท</p>
        <button onclick="buyItem('Oversize T-Shirt')">สั่งซื้อ</button>
        <button onclick="buy('Jeans')">
            ซื้อเลย
        </button>
    </div>

    <div class="product">
        <img src="images/473188138_632860312609439_4489939896814588420_n.jpg" alt="Hoodie">
        <h3>Hoodie</h3>
        <p>590 บาท</p>
        <button onclick="buyItem('Oversize T-Shirt')">สั่งซื้อ</button>
        <button onclick="buy('Hoodie')">
            ซื้อเลย
        </button>
    </div>

</div>

<footer>
© 2026 By Shop
</footer>
