<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>By Shop</title>

<style>
body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#000;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.banner{
background:#ff4d4d;

padding:40px;

}

.product{
background:white;
margin:15px;
padding:15px;

box-shadow:0 0 8px #ccc;
}

button{
background:#000;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
}
</style>

</head>

<body>

<header>
🛍️ By Shop
</header>

<div class="banner">
👕 ຍິນດີຕ້ອນຮັບສູ່ By Shop
</div>

<div class="product">
<h2>ເສື້ອ Oversize</h2>
<p>250,000 ກີບ</p>
<button>ຊື້ດຽວນີ້</button>
</div>

<div class="product">
<h2>ກາງເກງ Jeans</h2>
<p>390,000 ກີບ</p>
<button>ຊື້ດຽວນີ້</button>
</div>

</body>
</html>
